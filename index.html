<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>執行功能測驗組</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: centred title above a staggered row of hand-drawn frames → rounded task cards → stacked sections (pre-test notes, task grid, results) → sand sub-footer. Flat, single warm-white tone */
:root{
  --bg:#F4F3F1; --page:#F4F3F1; --ink:#151515; --ink-2:#3A3A38; --muted:#77756F; --faint:#AEACA5;
  --line:#E4E0D7; --line-2:#D4D0C6; --tab:#EBE9E4; --sand:#E4E1DA; --teal:#2B4A57; --sage:#CBD2BC; --sage-2:#A7B394;
  --card:#FFFFFF; --panel:#ECEAE5;
  --shadow:0 1px 2px rgba(21,21,21,.03);
  --glass-bg:#FFFFFF; --glass-edge:0 0 0 1px var(--line-2); --glass-blur:none;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html.running, html.running body{overflow:hidden}
body{background:var(--bg); color:var(--ink); font:400 15px/1.65 var(--font-body); letter-spacing:.005em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; -webkit-text-size-adjust:100%}
h1,h2,h3,b,strong,th{font-weight:500}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.inner{max-width:1040px; margin:0 auto; box-sizing:border-box; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.mark{display:block}

/* top strip */

/* intro */
.main{padding-block:24px 96px; display:flex; flex-direction:column; gap:72px}
.hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:20px}
.hmark{width:40px; height:40px; color:var(--sage-2)}
.hero h1{margin:16px 0 0; font:500 clamp(1.5rem,3.4vw,2.125rem)/1.35 var(--font-body); letter-spacing:.04em; text-wrap:balance}
.frames{position:relative; width:100%; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:clamp(8px,2vw,24px); align-items:start; margin-top:clamp(36px,6vw,64px)}
.frame svg{display:block; width:100%; height:auto}
.f1{margin-top:16%} .f2{margin-top:46%; width:84%; justify-self:center} .f3{margin-top:2%} .f4{margin-top:32%; width:90%; justify-self:center} .f5{margin-top:0; width:94%; justify-self:end} .f6{margin-top:42%} .f7{margin-top:10%; width:88%; justify-self:center}
.fdeco{position:absolute; right:-1%; top:-30%; width:clamp(64px,11vw,128px); height:auto; pointer-events:none}
@media (max-width:600px){
  .frames{grid-template-columns:repeat(4,minmax(0,1fr)); row-gap:4px}
  .f1{margin-top:10%} .f2{margin-top:34%} .f3{margin-top:0} .f4{margin-top:24%} .f5{margin-top:6%} .f6{margin-top:30%} .f7{margin-top:2%}
  .fdeco{top:-14%; right:-2%}
}
.br{font-size:.75rem; font-weight:500; letter-spacing:.06em; font-variant-numeric:tabular-nums}

/* sections */
.sec h2{font:500 1.375rem/1.35 var(--font-body); letter-spacing:-.015em; margin:0 0 16px}
.sec-prep h2{margin-bottom:12px}
.sec:not(.sec-prep){border-top:1px solid var(--line); padding-top:40px; margin-top:-24px}
.sec-head{display:flex; align-items:center; flex-wrap:wrap; gap:10px 20px; margin-bottom:4px}
.sec-head h2{margin:0; padding:0; border:0}
.hprog{display:flex; align-items:center; gap:10px; font-size:.8125rem; color:var(--muted); font-variant-numeric:tabular-nums}
.htrack{width:clamp(96px,22vw,180px); height:6px; border:1px solid var(--line-2); border-radius:3px; overflow:hidden; background:#fff}
.htrack i{display:block; height:100%; width:0; background:#C9C6C0; transition:width .4s ease}
.sec #sum{margin-top:16px}
.tgrid{display:grid; grid-template-columns:1fr; gap:16px; margin-top:24px}
@media (min-width:560px){ .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.idrow{display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin-top:20px; scroll-margin-top:24px}
.iderr{margin:0; font-size:.8125rem; color:#A23B2A}
.idrow input[aria-invalid="true"]{border-color:#C0412E}
.idrow label{font-size:.875rem; font-weight:500; white-space:nowrap}
.idrow input{width:min(240px,100%); min-width:0; box-sizing:border-box; font:400 16px/1.3 var(--font-body); padding:9px 18px; border:1px solid var(--line-2); border-radius:999px; background:#FBFAF7; color:var(--ink)}
.idrow input::placeholder{color:var(--faint)}
.idrow input:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.titem{display:flex; flex-direction:column; align-items:flex-start; text-align:left; padding:20px; border:1px solid var(--line-2); border-radius:22px; background:#FBFAF7; min-width:0}
.titem .doodle{width:96px; height:auto; display:block; margin-bottom:22px}
.titem .br{margin-bottom:10px}
.titem .zh{font:500 1.1875rem/1.35 var(--font-body); letter-spacing:-.01em}
.titem .en{font:500 .9375rem/1.4 var(--font-body); margin-top:8px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{display:inline-flex; align-items:center; padding:4px 11px; border:1px solid var(--line-2); border-radius:999px; font-size:.75rem; line-height:1.35; color:var(--ink-2)}
.titem .meta{margin-top:12px; font-size:.8125rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.titem .grow{flex:1 1 auto}
.titem .act{display:inline-flex; align-items:center; gap:12px; margin-top:16px; min-height:44px; padding:0 20px; border:0; border-radius:999px; background:var(--tint); color:var(--ink); font:500 .8125rem/1 var(--font-body); letter-spacing:.04em; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.titem .act svg{width:26px; height:8px}
.titem .done{display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:.8125rem; color:var(--ink-2)}
.titem .done svg{width:14px; height:14px; flex:none}
.numlist{list-style:none; margin:0; padding:0}
.numlist li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:8px 0; font-size:.9375rem}
.numlist .br{padding-top:3px}

/* results */
.empty{margin:0; padding:18px 20px; background:var(--panel); border-radius:18px; color:var(--muted); font-size:.875rem}
.rlist{display:flex; flex-direction:column; gap:10px}
.ritem{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto auto; grid-template-areas:"n k t g"; align-items:center; gap:8px 18px; width:100%; text-align:left; padding:14px 14px 14px 20px; border:1px solid var(--line-2); border-radius:20px; background:#FBFAF7; color:inherit; font:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.rname{grid-area:n; font-weight:500}
.rkey{grid-area:k; font-size:.875rem; color:var(--ink-2); font-variant-numeric:tabular-nums; min-width:0}
.rtime{grid-area:t; font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.rgo{grid-area:g; display:inline-flex; align-items:center; gap:10px; min-height:38px; padding:0 16px; border-radius:999px; background:var(--tint); font-size:.8125rem; font-weight:500; white-space:nowrap}
.rgo svg{width:22px; height:8px}
@media (max-width:620px){ .ritem{grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"n g" "k k" "t t"; padding:14px 14px 14px 18px} }
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.btn{font:500 .8125rem/1.3 var(--font-body); letter-spacing:.06em; padding:11px 20px; border-radius:999px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; touch-action:manipulation}
.btn.primary{background:var(--ink); color:#fff}
.btn.danger{color:#A23B2A; border-color:#D9B5AD}
.btn:disabled{opacity:.35; cursor:not-allowed}
.copymsg{margin:12px 0 0; font-size:.8125rem; color:var(--ink-2)}
#copyBox{width:100%; box-sizing:border-box; min-height:120px; margin-top:10px; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; padding:12px; border-radius:2px; border:1px solid var(--line-2); background:#fff; color:var(--ink)}

.subfoot{background:var(--sand)}
.subfoot-in{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 24px; padding-block:20px; font-size:.6875rem; letter-spacing:.06em; color:var(--muted)}

/* ---------- test display ---------- */
#runner{position:fixed; inset:0; z-index:50; background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
  touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none}
.rbar{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line)}
.rbar #rCode{font-size:.6875rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase}
.rbar #rProg{flex:1; color:var(--muted); font-size:.8125rem; font-variant-numeric:tabular-nums}
#rExit{font:500 .8125rem/1.3 var(--font-body); color:var(--ink); background:var(--glass-bg); border:0; border-radius:999px; padding:7px 15px; box-shadow:var(--glass-edge), 0 4px 12px -8px rgba(60,46,32,.3); cursor:pointer}
#rExit.armed{color:#A23B2A; box-shadow:0 0 0 1px #A23B2A}
.rstim{flex:1; min-height:0; position:relative; display:grid; place-items:center; overflow:hidden}
.rstim.scroll{place-items:start center; overflow-y:auto; -webkit-overflow-scrolling:touch; user-select:text; -webkit-user-select:text}
.rresp{display:grid; gap:10px; padding:12px 16px 18px; width:100%; max-width:780px; margin:0 auto; box-sizing:border-box}
.rresp.cols-1{grid-template-columns:1fr}
.rresp.cols-2{grid-template-columns:1fr 1fr}
.rresp.cols-3{grid-template-columns:repeat(3,1fr)}
.rresp.cols-4{grid-template-columns:repeat(4,1fr)}
.rbtn{min-height:64px; border-radius:20px; border:0; background:var(--glass-bg); box-shadow:var(--glass-edge), var(--shadow); color:var(--ink); font:500 1rem/1.3 var(--font-body); cursor:pointer; touch-action:manipulation; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px; transition:transform .08s, background .08s}
.rbtn small{font-size:.6875rem; font-weight:500; letter-spacing:.18em; color:var(--muted)}
.rbtn.go{background:var(--ink); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 10px 22px -12px rgba(20,20,20,.55)}
.rbtn.go small{color:#fff}
.rbtn.hit{transform:scale(.96); background:rgba(255,255,255,.35)}
.rbtn.go.hit{background:#3A3936}
.rbtn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.rbtn.sw{min-height:84px; box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(0,0,0,.06), var(--shadow)}
.rbtn.sw.hit{filter:brightness(.88)}
.rbtn.tall{min-height:96px}
.rbtn.match{min-height:104px; font-size:1.1875rem}
.rbtn.card{min-height:0; padding:6px}
.rbtn.card svg{width:100%; height:auto; display:block; max-height:22vh}
.rbtn.dtarget svg{width:clamp(72px,12vmin,120px); height:clamp(72px,12vmin,120px)}

.inst{width:100%; max-width:560px; box-sizing:border-box; padding:26px 20px 28px; display:flex; flex-direction:column; gap:12px}
.inst h2{font:500 1.375rem/1.35 var(--font-body); letter-spacing:-.015em; margin:0; text-wrap:balance}
.inst .ename{margin:-8px 0 2px; font-size:.8125rem; color:var(--muted)}
.inst p{margin:0; line-height:1.7}
.inst ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:4px}
.inst strong{font-weight:500}
.inst .small{font-size:.8125rem; color:var(--muted)}
.demo{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--glass-bg); border-radius:18px; box-shadow:var(--glass-edge), 0 8px 20px -14px rgba(60,46,32,.25); padding:14px 16px}
.demo .dword{font-size:44px; font-weight:700; line-height:1}
.dot{display:inline-block; width:18px; height:18px; border-radius:5px; vertical-align:-3px; margin:0 4px}
.seq-note{font-size:.8125rem; color:var(--muted)}
.minis{display:flex; gap:8px; flex-wrap:wrap}
.mini{display:grid; grid-template-columns:repeat(3,1fr); width:46px; height:46px; gap:3px; padding:3px; box-sizing:border-box; border:1px solid var(--line); border-radius:6px; background:var(--card)}
.mini i{border-radius:2px}
.mini i.on{background:#3F7EFF}
.mini.hl{outline:2px solid var(--ink); outline-offset:1px}
.rtab{margin:0; display:flex; flex-direction:column; border-top:1px solid var(--line)}
.rtab div{display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line)}
.rtab dt{color:var(--muted)}
.rtab dd{margin:0; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.rtab div.key dd, .rtab div.key dt{color:var(--ink); font-weight:500}
.note{font-size:.8125rem; color:var(--muted)}
.eyebrow{margin:0; font-size:.6875rem; font-weight:500; line-height:1.4; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.rgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.rbox{display:flex; flex-direction:column; gap:6px; padding:12px 14px; border:1px solid var(--line-2); border-radius:16px; background:#fff; min-width:0}
.rbox.key{background:var(--tint); border-color:transparent}
.rl{font-size:.75rem; line-height:1.4; color:var(--muted)}
.rbox.key .rl{color:var(--ink-2)}
.rle{display:block; margin-top:2px; font-size:.6875rem; letter-spacing:.01em; opacity:.85}
.rv{font-size:1.125rem; font-weight:500; line-height:1.3; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}

.fix{font:300 56px/1 var(--font-body); color:var(--faint)}
.word{font:700 clamp(80px, min(30vw,24vh), 220px)/1 var(--font-body)}
.arws{display:flex; gap:clamp(4px,1.5vw,12px); color:var(--ink)}
.arws svg{width:clamp(44px, min(15vw,11vh), 104px); height:auto}
.nfb{position:absolute; inset:0; display:grid; place-items:center; background:var(--bg)}
.nfb:empty{display:none}
.fbk{font-size:1.75rem; font-weight:500}
.ok{color:#2E7D4F} .err{color:#B23B2A} .slow{color:#A26B10}
.dccs{display:flex; flex-direction:column; align-items:center; gap:22px}
.cue{font-size:clamp(36px,6vmin,52px); font-weight:500; display:flex; flex-direction:column; align-items:center; line-height:1.1}
.cue small{font-size:.6875rem; font-weight:500; letter-spacing:.18em; color:var(--muted); margin-top:6px}
.dslot{width:clamp(140px,24vmin,240px); height:clamp(140px,24vmin,240px); display:grid; place-items:center}
.dcard{width:100%; height:100%; border-radius:22px; background:var(--glass-bg); box-shadow:var(--glass-edge), var(--shadow); display:grid; place-items:center}
.dcard svg{width:68%; height:68%}
.wstage{display:flex; flex-direction:column; align-items:center; gap:16px}
.wcard{width:clamp(110px, min(34vw,26vh), 230px); border-radius:14px; background:var(--glass-bg); box-shadow:var(--glass-edge), var(--shadow); padding:6px}
.wcard svg{display:block; width:100%; height:auto}
.wfb{height:3.25rem; display:grid; place-items:center}
.nbgrid{display:grid; grid-template-columns:repeat(3,1fr); width:min(84vw,50vh,520px); aspect-ratio:1; max-width:100%; gap:clamp(8px,2.5vw,16px)}
.nbc{border-radius:8px; display:grid; place-items:center}
.nbc.on{background:#3F7EFF}
.nbfix{font:300 30px/1 var(--font-body); color:var(--faint)}

@media (min-width:700px){
  .rbar{padding:14px 24px}
  .rresp{gap:14px; padding:16px 24px 28px}
  .rbtn{min-height:76px; font-size:1.0625rem; border-radius:24px}
  .rbtn.sw{min-height:104px}
  .rbtn.tall{min-height:116px}
  .rbtn.match{min-height:124px; font-size:1.375rem}
  .inst{max-width:660px; padding-top:44px; gap:14px}
  .inst h2{font-size:1.5rem}
  .demo .dword{font-size:56px}
  .mini{width:58px; height:58px}
  .fbk{font-size:2rem}
}
@media (prefers-reduced-motion: reduce){ .rbtn,.task{transition:none} }
/* flat overrides for the test display */
.rbtn{border-radius:6px}
.rbtn.go{background:var(--ink); box-shadow:none}
.rbtn.hit{background:var(--tab)}
.rbtn.sw{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
#rExit{border-radius:2px; background:transparent; box-shadow:0 0 0 1px var(--line-2)}
.demo{border-radius:4px; background:var(--tab); box-shadow:none}
.dcard{border-radius:8px}
.xxxx{font:700 clamp(56px, min(19vw,16vh), 160px)/1 var(--font-body); letter-spacing:.06em}
.rbtn.big{font-size:1.5rem; min-height:76px}
.rbtn:disabled{opacity:.35; cursor:default}
.rresp.keypad{max-width:440px}
.rbtn.key{min-height:56px; font-size:1.375rem}
.rbtn.key[data-r="del"], .rbtn.key[data-r="ok"]{font-size:1rem}
.gng svg{display:block; width:clamp(120px,30vmin,220px); height:auto}
.digit{font:500 clamp(96px,30vmin,180px)/1 var(--font-body)}
.dsin{display:flex; flex-direction:column; align-items:center; gap:18px; padding:0 16px}
.dsq{margin:0; font-size:1rem; color:var(--muted)}
.dsline{min-width:min(78vw,340px); min-height:1.3em; padding:0 8px 8px; border-bottom:2px solid var(--line-2); text-align:center; font:500 clamp(26px,7vw,40px)/1.2 var(--font-body); letter-spacing:.08em; font-variant-numeric:tabular-nums}
.slots{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.slots span{width:clamp(28px,8vw,46px); height:clamp(40px,10vw,58px); border-bottom:2px solid var(--line-2); display:grid; place-items:center; font:500 clamp(22px,6vw,34px)/1 var(--font-body)}
.slots span.on{border-color:var(--ink)}
.dsfb{display:flex; flex-direction:column; align-items:center; gap:10px}
.dsfb p{margin:0; font-size:1.125rem}
.dsx{font-size:1.5rem; font-weight:500; letter-spacing:.2em}
@media (min-width:700px){ .rbtn.key{min-height:68px} }
@media (min-width:700px){ .rbtn.big{font-size:1.75rem; min-height:100px} }
.wcard{border-radius:6px}
@media (min-width:700px){ .rbtn{border-radius:8px} }
/* one button height across test screens (WCST picture cards excepted) */
#runner{--bh:72px}
@media (min-width:700px){ #runner{--bh:88px} }
.rbtn:not(.card), .rbtn.dtarget{min-height:var(--bh); height:var(--bh)}
.rbtn.dtarget{padding:6px}
.rbtn.dtarget svg{width:auto; height:100%; max-height:none}
.ddemo{flex-direction:column; align-items:stretch; gap:12px}
.dd-row{display:flex; align-items:center; gap:10px}
.dd-lab{width:5em; flex:none; font-size:.8125rem; color:var(--muted)}
.dd-card{width:56px; height:56px; flex:none; display:grid; place-items:center; border-radius:10px; background:#fff; box-shadow:0 0 0 1px var(--line-2)}
.dd-card svg{width:42px; height:42px}
.dd-rules{display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--line-2)}
.dd-rules > span{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.dd-mini{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:6px; background:#fff; box-shadow:0 0 0 1px var(--line-2)}
.dd-mini svg{width:20px; height:20px}
.tol{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:560px; padding:12px 16px; box-sizing:border-box; position:relative}
.tol-goal{display:flex; align-items:center; gap:12px; padding:8px 14px; border-radius:16px; background:var(--panel)}
.tol-lab{font-size:.8125rem; font-weight:500; color:var(--ink-2)}
.tol-mini{width:clamp(110px,30vw,170px); height:auto; display:block}
.tol-info{display:flex; gap:16px; font-size:.875rem; color:var(--muted); font-variant-numeric:tabular-nums}
.tol-wrap{width:100%}
.tol-board{width:100%; max-height:46vh; height:auto; display:block; touch-action:manipulation; cursor:pointer}
.tol-board .lift{filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.tol-fb{position:absolute; inset:0; display:grid; place-items:center; background:rgba(244,243,241,.92); border-radius:12px; text-align:center; padding:0 16px}
.tol-fb:empty{display:none}
</style>
</head>
<body>

<script>
(() => {
'use strict';
// 結果上傳：貼上 Google Apps Script 網頁應用程式的網址（https://script.google.com/macros/s/…/exec），留空則不上傳
const API_URL = 'https://script.google.com/macros/s/AKfycby4IbYApHZSjvMIe1kjMItyh0ChN53-Tui8dUeKZjwFWzgFHYdeRIEzhtswCPG3T_w/exec';
const $ = s => document.querySelector(s);
const K = ['r','g','b','y'];
const COL = {
  r:{n:'紅', label:'紅色', hex:'#F2463C'},
  g:{n:'綠', label:'綠色', hex:'#2EBF5A'},
  b:{n:'藍', label:'藍色', hex:'#3F7EFF'},
  y:{n:'黃', label:'黃色', hex:'#E3AC00'}
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : NaN;
const pct = x => isNaN(x) ? '—' : Math.round(x*100) + '%';
const ms = x => isNaN(x) ? '—' : Math.round(x) + ' ms';
const sms = x => isNaN(x) ? '—' : (x>=0?'+':'−') + Math.abs(Math.round(x)) + ' ms';
const spct = x => isNaN(x) ? '—' : (x>=0?'+':'−') + Math.abs(Math.round(x*100)) + '%';

/* ---------- session / abort ---------- */
const ABORT = Symbol('abort');
let session = null;
function newSession(){ session = {aborted:false, rejects:new Set(), cleanups:new Set()}; }
function abortSession(){
  if (!session || session.aborted) return;
  session.aborted = true;
  session.cleanups.forEach(f => f()); session.cleanups.clear();
  session.rejects.forEach(r => r(ABORT)); session.rejects.clear();
}
function guard(p){
  const s = session;
  return new Promise((res, rej) => {
    if (s.aborted) return rej(ABORT);
    s.rejects.add(rej);
    p.then(v => { s.rejects.delete(rej); if (s.aborted) rej(ABORT); else res(v); },
           e => { s.rejects.delete(rej); rej(e); });
  });
}
const sleep = t => guard(new Promise(r => setTimeout(r, t)));
const frame = () => guard(new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));

/* ---------- runner ---------- */
const runner = $('#runner'), rCode = $('#rCode'), rProg = $('#rProg'), rStim = $('#rStim'), rResp = $('#rResp'), rExit = $('#rExit');
let wakeLock = null;
function openRunner(code){
  rCode.textContent = code; rProg.textContent = ''; rStim.innerHTML = ''; rResp.innerHTML = '';
  runner.hidden = false; document.documentElement.classList.add('running');
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(()=>{}); } catch(e){}
}
function closeRunner(){
  runner.hidden = true; document.documentElement.classList.remove('running');
  try { if (wakeLock) wakeLock.release(); } catch(e){}
  wakeLock = null; resetExit();
}
let exitArmed = false, exitTimer = null;
function resetExit(){ exitArmed = false; clearTimeout(exitTimer); rExit.textContent = '結束'; rExit.classList.remove('armed'); }
rExit.addEventListener('click', () => {
  if (!exitArmed){ exitArmed = true; rExit.textContent = '再按一次結束'; rExit.classList.add('armed'); exitTimer = setTimeout(resetExit, 2500); return; }
  resetExit(); abortSession();
});
const setProg = t => { rProg.textContent = t; };
function setResp(html, cols){ rResp.className = 'rresp cols-' + cols; rResp.innerHTML = html; }
function pressFx(b){ b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 140); }
function evtTime(e){ const now = performance.now(); return (e.timeStamp > 0 && e.timeStamp <= now && now - e.timeStamp < 500) ? e.timeStamp : now; }

function waitResp(t0, timeout){
  const s = session;
  return guard(new Promise(res => {
    let done = false, timer = null;
    const finish = (r, t) => { if (done) return; done = true; cleanup(); res({r, rt: r == null ? null : Math.round(t - t0)}); };
    const onPtr = e => {
      const b = e.target.closest('[data-r]');
      if (!b || !rResp.contains(b) || b.disabled) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); const t = evtTime(e); pressFx(b); finish(b.dataset.r, t);
    };
    const onKey = e => {
      if (e.repeat) return;
      const b = [...rResp.querySelectorAll('[data-k]')].find(x => x.dataset.k.split('|').includes(e.key));
      if (!b || b.disabled) return;
      e.preventDefault(); const t = evtTime(e); pressFx(b); finish(b.dataset.r, t);
    };
    function cleanup(){ rResp.removeEventListener('pointerdown', onPtr); document.removeEventListener('keydown', onKey); clearTimeout(timer); s.cleanups.delete(cleanup); }
    rResp.addEventListener('pointerdown', onPtr);
    document.addEventListener('keydown', onKey);
    s.cleanups.add(cleanup);
    if (timeout > 0) timer = setTimeout(() => finish(null, 0), Math.max(0, timeout - (performance.now() - t0)));
  }));
}

async function screen(html, buttons){
  buttons = buttons || [{label:'開始', value:'go', cls:'go'}];
  rStim.className = 'rstim scroll';
  rStim.innerHTML = '<div class="inst">' + html + '</div>';
  rStim.scrollTop = 0;
  setResp(buttons.map((b,i) => `<button type="button" class="rbtn ${b.cls||''}" data-r="${b.value}"${b.cls==='go'?' data-k="Enter"':''}>${b.label}</button>`).join(''), buttons.length);
  const r = await waitResp(performance.now(), 0);
  rStim.className = 'rstim'; rStim.innerHTML = '';
  await sleep(250);
  return r.r;
}
async function feedback(kind){
  const txt = {ok:'✓ 正確', err:'✗ 錯誤', slow:'太慢了'}[kind];
  rStim.innerHTML = `<div class="fbk ${kind}">${txt}</div>`;
  await sleep(kind === 'ok' ? 500 : 900);
  rStim.innerHTML = '';
}
async function practiceGate(nOk, n, speed = true){
  const good = nOk / n >= 0.8;
  return screen(`<p class="eyebrow">練習結束</p><h2>答對${nOk}/${n}</h2>
    <p>${good ? (speed ? '規則清楚了就開始正式測驗，正式測驗不會顯示對錯，請答得又快又正確' : '規則清楚了就開始正式測驗，正式測驗不會顯示對錯，答對最重要') : '建議再練習一次，確定規則清楚再開始'}</p>`,
    [{label:'再練習一次', value:'again'}, {label:'開始正式測驗', value:'go', cls:'go'}]);
}
async function getReady(){ rStim.innerHTML = '<div class="fix">準備</div>'; await sleep(1000); rStim.innerHTML = ''; await sleep(400); }

/* ================= STROOP (Golden-style, 3 timed cards) ================= */
const SK = ['r','g','b'];
const SCOL = {r:'#E0342A', g:'#1E9A48', b:'#2F6BE8'};
const SDUR = 45000;
const SBLOCK = {
  word:{name:'第一關：讀出黑字',
    inst:'<p>請按下和<strong>這個字</strong>相同的按鈕</p>',
    demo:'<span class="dword" style="color:var(--ink)">綠</span><span>→ 按「綠」</span>'},
  color:{name:'第二關：命名顏色',
    inst:'<p>請按下和<strong>XXXX顏色</strong>相同的按鈕</p>',
    demo:`<span class="dword" style="color:${SCOL.r}">XXXX</span><span>→ 按「紅」</span>`},
  cw:{name:'第三關：命名色字',
    inst:'<p>畫面會出現用不同顏色寫的「紅」、「綠」、「藍」</p><p><strong>請忽略字的意思，按下和這個字顏色相同的按鈕</strong></p>',
    demo:`<span class="dword" style="color:${SCOL.b}">紅</span><span>→ 按「藍」</span>`}
};
function stroopNext(kind, prev){
  let it;
  do {
    const w = SK[randInt(0,2)];
    if (kind === 'word') it = {word:w, ink:null, ans:w};
    else if (kind === 'color') it = {word:null, ink:w, ans:w};
    else { const others = SK.filter(x => x !== w), c = others[randInt(0,1)]; it = {word:w, ink:c, ans:c}; }
  } while (prev && it.word === prev.word && it.ink === prev.ink);
  return it;
}
async function stroopBlock(kind){
  setResp(SK.map((k,i) => `<button type="button" class="rbtn big" data-r="${k}" data-k="${i+1}">${COL[k].n}</button>`).join(''), 3);
  await getReady();
  const out = [], tStart = performance.now();
  let prev = null;
  const tick = () => setProg(`剩餘${Math.max(0, Math.ceil((SDUR - (performance.now() - tStart)) / 1000))}秒`);
  tick();
  const timer = setInterval(tick, 200);
  try {
    while (performance.now() - tStart < SDUR){
      const it = stroopNext(kind, prev); prev = it;
      rStim.innerHTML = kind === 'color'
        ? `<div class="xxxx" style="color:${SCOL[it.ink]}">XXXX</div>`
        : `<div class="word" style="color:${kind === 'word' ? 'var(--ink)' : SCOL[it.ink]}">${COL[it.word].n}</div>`;
      await frame();
      const t0 = performance.now(), left = SDUR - (t0 - tStart);
      if (left <= 0) break;
      const r = await waitResp(t0, left);
      if (r.r == null) break;
      out.push({block:kind, trial:out.length+1, cond:kind,
        stim: kind === 'word' ? `word=${it.word}` : kind === 'color' ? `XXXX;ink=${it.ink}` : `word=${it.word};ink=${it.ink}`,
        cresp:it.ans, resp:r.r, acc: r.r === it.ans ? 1 : 0, rt:r.rt});
      rStim.innerHTML = '';
      await sleep(120);
    }
  } finally { clearInterval(timer); }
  setProg('時間到');
  rStim.innerHTML = '<div class="fbk">時間到</div>';
  await sleep(1100);
  rStim.innerHTML = '';
  return out;
}
async function runStroop(){
  await screen(`<h2>史楚普色字測驗</h2><p class="ename">Stroop Color Word Test</p>
    <p>共有三個關卡，每關<strong>45秒</strong>，請答對越多越好</p>`, [{label:'下一步', value:'go', cls:'go'}]);
  const res = {}, trials = [];
  const kinds = ['word','color','cw'];
  for (let i=0;i<3;i++){
    const kind = kinds[i], B = SBLOCK[kind];
    rCode.textContent = `SCWT ${i+1}/3`;
    setProg('');
    await screen(`<p class="eyebrow">第${i+1}關，共3關 · 45秒</p><h2>${B.name}</h2>${B.inst}<div class="demo">${B.demo}</div>`, [{label:'開始正式測驗', value:'go', cls:'go'}]);
    const out = await stroopBlock(kind);
    trials.push(...out);
    res[kind] = {n: out.length, ok: out.filter(t => t.acc).length};
  }
  rCode.textContent = 'SCWT';
  const W = res.word.ok, C = res.color.ok, CW = res.cw.ok;
  const pred = (W + C) ? (W * C) / (W + C) : NaN, intf = CW - pred;
  const sf1 = x => isNaN(x) ? '—' : (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1);
  return {
    key:`黑字${W} · 顏色${C} · 色字${CW} · 干擾${sf1(intf)}`,
    metrics:{W, C, CW, intf},
    summary:[
      ['讀出黑字正確數（raw Word score）', `${W}`, 1],
      ['命名顏色正確數（raw Color score）', `${C}`, 1],
      ['命名色字正確數（raw Color-Word score）', `${CW}`, 1],
      ['干擾分數（interference score）', sf1(intf), 1]],
    note:'每關分數為45秒內答對的個數<br>干擾分數＝實際色字分數減預測色字分數（Golden, 1978）；負值越大，代表越難壓下「讀字」的自動反應<br>這裡使用原始分數，未做年齡校正',
    trials
  };
}

/* ================= GO / NO-GO ================= */
function zinv(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl = 0.02425; let q, r;
  if (p < pl){ q = Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p <= 1-pl){ q = p-0.5; r = q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q = Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
const GO_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="14" y="14" width="72" height="72" rx="4" fill="#1E9A48"/></svg>';
const NOGO_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="14" y="14" width="72" height="72" rx="4" fill="#E0342A"/></svg>';
// No-Go never twice in a row; the first `lead` trials are Go
function gngList(nGo, nNo, lead){
  const set = new Set(shuffle([...Array(nGo - lead + 1).keys()].map(i => i + lead)).slice(0, nNo));
  const L = [];
  for (let g=0; g<=nGo; g++){ if (set.has(g)) L.push('nogo'); if (g < nGo) L.push('go'); }
  return L;
}
async function gngTrial(type, prac, i){
  rStim.innerHTML = '<div class="fix">+</div>';
  await sleep(500);
  rStim.innerHTML = `<div class="gng">${type === 'go' ? GO_SVG : NOGO_SVG}</div>`;
  await frame(); const t0 = performance.now();
  const hide = setTimeout(() => { const el = rStim.querySelector('.gng'); if (el) el.innerHTML = ''; }, 500);
  // stimulus 500 ms + inter-trial interval 1000 ms; responses count until the next fixation
  const r = await waitResp(t0, 1500);
  const resp = !!r.r;
  if (resp){ const rem = 1500 - (performance.now() - t0); if (rem > 0) await sleep(rem); }
  clearTimeout(hide); rStim.innerHTML = '';
  const acc = type === 'go' ? (resp ? 1 : 0) : (resp ? 0 : 1);
  if (prac) await feedback(type === 'go' ? (resp ? 'ok' : 'slow') : (resp ? 'err' : 'ok'));
  return {block: prac ? 'practice' : 'test', trial:i+1, cond:type, stim: type === 'go' ? 'green-square' : 'red-square', cresp: type === 'go' ? 'press' : 'none', resp: resp ? 'press' : 'none', acc, rt: resp ? r.rt : null};
}
async function runGoNoGo(){
  await screen(`<h2>Go/No-Go作業</h2><p class="ename">Go/No-Go Task</p>
    <p>畫面中央會很快地出現圖形</p>
    <div class="demo"><span style="width:44px;display:block">${GO_SVG}</span><span>看到<strong>綠色正方形</strong>，請盡快按下「Go」的按鈕</span></div>
    <div class="demo"><span style="width:44px;display:block">${NOGO_SVG}</span><span>看到<strong>紅色正方形</strong>，<strong>不按</strong></span></div>
    <p>請答得又快又正確</p>`, [{label:'開始練習', value:'go', cls:'go'}]);
  const btn = () => setResp('<button type="button" class="rbtn match" data-r="p" data-k=" |Enter">Go</button>', 1);
  let gate;
  do {
    btn(); await getReady();
    const P = gngList(8, 2, 2), out = [];
    for (let i=0;i<P.length;i++){ setProg(`練習${i+1}/${P.length}`); out.push(await gngTrial(P[i], true, i)); }
    gate = await practiceGate(out.filter(t => t.acc).length, out.length);
  } while (gate === 'again');
  btn(); await getReady();
  const L = gngList(64, 16, 3), trials = [];
  for (let i=0;i<L.length;i++){ setProg(`正式${i+1}/${L.length}`); trials.push(await gngTrial(L[i], false, i)); }
  const G = trials.filter(t => t.cond === 'go'), N = trials.filter(t => t.cond === 'nogo');
  const hit = G.filter(t => t.resp === 'press'), fa = N.filter(t => t.resp === 'press');
  // RT: Go hits only; drop <150 ms and > mean + 2.5 SD
  const base = hit.filter(t => t.rt >= 150).map(t => t.rt);
  const m0 = mean(base), sd0 = base.length > 1 ? Math.sqrt(base.reduce((a,x) => a + (x - m0) ** 2, 0) / (base.length - 1)) : 0;
  const rts = base.filter(x => x <= m0 + 2.5 * sd0);
  const goRT = mean(rts), goSD = rts.length > 1 ? Math.sqrt(rts.reduce((a,x) => a + (x - goRT) ** 2, 0) / (rts.length - 1)) : NaN;
  const com = fa.length / N.length, om = (G.length - hit.length) / G.length;
  return {
    key:`No-Go誤按率${pct(com)}`,
    metrics:{com, om, rt:goRT, sd:goSD},
    summary:[
      ['No-Go誤按率（Commission error rate）', `${pct(com)}（${fa.length}/${N.length}）`, 1],
      ['漏判率（Omission error rate）', `${pct(om)}（${G.length - hit.length}/${G.length}）`],
      ['Go反應時間（Go reaction time）', ms(goRT)],
      ['Go平均反應時間變異度（Go reaction time variability）', ms(goSD)]],
    note:'',
    trials
  };
}

/* ================= N-BACK (spatial) ================= */
const NB_POS = [0,1,2,3,5,6,7,8];
const posName = p => `r${Math.floor(p/3)+1}c${p%3+1}`;
function nbackSeq(n, scorable, pT){
  const nT = Math.round(scorable * pT);
  const tset = new Set(shuffle([...Array(scorable).keys()].map(i => i + n)).slice(0, nT));
  const seq = [];
  for (let i=0;i<n+scorable;i++){
    if (i >= n && tset.has(i)) seq.push(seq[i-n]);

function dccsCards(n){
  for (;;){
    const L = shuffle(Array.from({length:n}, (_,i) => i % 2 ? 'rr' : 'bb'));
    let run = 1, ok = true;
    for (let i=1;i<L.length;i++){ run = L[i] === L[i-1] ? run + 1 : 1; if (run > 3){ ok = false; break; } }
    if (ok) return L;
  }
}
const other = r => r === 'color' ? 'shape' : 'color';
// 20 mixed trials: exactly 7 switches relative to the previous trial (the last trial of block 3 uses rule A)
function dccsMixed(A){
  for (;;){
    const sw = new Set(shuffle([...Array(20).keys()]).slice(0, 7));
    let cur = A; const rules = [], types = [];
    for (let i=0;i<20;i++){ if (sw.has(i)) cur = other(cur); rules.push(cur); types.push(sw.has(i) ? 'switch' : 'nonswitch'); }
    const nA = rules.filter(r => r === A).length;
    if (nA >= 8 && nA <= 12) return {rules, types};
  }
}

  if (s==='star') return `<path d="${starPath(x, y+1, r*1.15, r*.48)}" fill="${fill}"/>`;
  const w = r*.36;
  return `<path d="M${x-w} ${y-r}H${x+w}V${y-w}H${x+r}V${y+w}H${x+w}V${y+r}H${x-w}V${y+w}H${x-r}V${y-w}H${x-w}Z" fill="${fill}"/>`;
}
const POS = {1:[[50,70]], 2:[[50,42],[50,98]], 3:[[32,30],[68,70],[32,110]], 4:[[28,46],[72,46],[28,94],[72,94]]};
const wCard = c => `<svg viewBox="0 0 100 140" aria-hidden="true">${POS[c.n].map(([x,y]) => wShape(c.s, x, y, 15, COL[c.c].hex)).join('')}</svg>`;
const wName = c => `${c.n}個${COL[c.c].label}${SHN[c.s]}`;
function wcstDeck(size){
  const all = [];
  for (const n of [1,2,3,4]) for (const c of K) for (const s of SH) all.push({n,c,s});
  const usable = all.filter(x => !WKEYS.some(k => k.n===x.n && k.c===x.c && k.s===x.s));
  let deck = [];
  for (let d=0; d<size/64; d++) deck = deck.concat(shuffle(usable.concat(shuffle(usable).slice(0,4))));
  return deck;
}
const wMatch = (c, k) => ({color: c.c===k.c, shape: c.s===k.s, number: c.n===k.n});
const wCorrectKey = (c, rule) => WKEYS.findIndex(k => wMatch(c,k)[rule]) + 1;
async function runWCST(){
  await screen(`<h2>威斯康辛卡片分類測驗</h2><p class="ename">Wisconsin Card Sorting Test</p>
    <p>這是一個特別分類遊戲，請將中間顯示的卡片根據某個規則分類到下面四堆卡片的其中一堆</p>
    <p>電腦不會告訴你分類規則，但在分類後，會告訴你分類「正確」或「錯誤」</p>
    <p>分類規則會在你不知道的時候改變，如果發現分類規則改變了，請試著找出新的分類規則</p>`, [{label:'開始正式測驗', value:'go', cls:'go'}]);
  const deck = wcstDeck(128);
  setResp(WKEYS.map((k,i) => `<button type="button" class="rbtn card" data-r="${i+1}" data-k="${i+1}" aria-label="${wName(k)}">${wCard(k)}</button>`).join(''), 4);
  await getReady();
  let cat = 0, run = 0, P = null, firstCat = null;
  const trials = [];
  for (let i=0; i<deck.length && cat<6; i++){
    const c = deck[i], rule = RULES[cat];
    setProg(`${i+1}/${deck.length}`);
    rStim.innerHTML = `<div class="wstage"><div class="wcard" role="img" aria-label="${wName(c)}">${wCard(c)}</div><div class="wfb"></div></div>`;
    await frame(); const t0 = performance.now();
    const r = await waitResp(t0, 0);
    const k = +r.r, m = wMatch(c, WKEYS[k-1]);
    const correct = m[rule];
    const dims = Object.keys(m).filter(d => m[d]);
    const persev = !correct && P != null && m[P];
    if (!correct && P == null && cat === 0 && dims.length === 1) P = dims[0];
    const fms = !correct && run >= 5;
    rStim.querySelector('.wfb').innerHTML = correct ? '<div class="fbk ok">✓ 正確</div>' : '<div class="fbk err">✗ 錯誤</div>';
    await sleep(800);
    if (correct){ run++; if (run === 10){ cat++; if (cat === 1) firstCat = i+1; P = rule; run = 0; } } else run = 0;
    trials.push({block:`category${Math.min(cat + (correct && run===0 ? 0 : 1), 6)}`, trial:i+1, cond: rule + (persev?';perseverative':'') + (fms?';fms':''), stim:`${c.n}-${c.c}-${c.s}`, cresp:String(wCorrectKey(c, rule)), resp:String(k), acc: correct?1:0, rt:r.rt, persev, fms});
    rStim.innerHTML = '';
    await sleep(250);
  }
  const n = trials.length, nOk = trials.filter(t=>t.acc).length, err = n - nOk;
  const pe = trials.filter(t=>t.persev).length, fms = trials.filter(t=>t.fms).length;
  let clr = 0, streak = 0;
  for (const t of trials.concat([{acc:0}])){ if (t.acc) streak++; else { if (streak >= 3) clr += streak; streak = 0; } }
  return {
    key:`固著性錯誤數${pe}`,
    metrics:{pe, cat, trials:n, correct:nOk, errors:err, firstCat:firstCat || null},
    summary:[
      ['使用卡片數（number of trials administered）', `${n}`],
      ['總正確數（total correct）', `${nOk}`],
      ['總錯誤數（total errors）', `${err}`],
      ['固著性錯誤數（perseverative errors）', `${pe}`, 1],
      ['非固著性錯誤數（nonperseverative errors）', `${err - pe}`],
      ['完成第一類別所需卡片數（trials to complete first category）', firstCat ? `${firstCat}` : '未完成'],
      ['完成類別數（number of categories completed）', `${cat}`]],
    note:'',
    trials
  };
}

/* ================= TOWER OF LONDON ================= */
const TOL_CAP = [3, 2, 1];
const TOL_START = 'rg|b|';
const TOL_SET = {practice:['r|b|g', 'rb||g'],
  test:['|br|g','|bg|r','rbg||','r|gb|','gr|b|','b|gr|','gb||r','|gb|r','gb|r|','grb||','b|g|r','gr||b']};
const TOL_COL = {r:'#E0342A', g:'#1E9A48', b:'#2F6BE8'};
const tolParse = s => s.split('|').map(p => p.split('').filter(Boolean));
const tolKey = st => st.map(p => p.join('')).join('|');
function tolMin(from, to){
  const goal = tolKey(to), seen = new Set([tolKey(from)]); let q = [from], d = 0;
  while (q.length){
    if (q.some(s => tolKey(s) === goal)) return d;
    const nq = [];
    for (const s of q) for (let a=0;a<3;a++) if (s[a].length) for (let b=0;b<3;b++){
      if (a === b || s[b].length >= TOL_CAP[b]) continue;
      const t = s.map(p => p.slice()); t[b].push(t[a].pop());
      const k = tolKey(t); if (!seen.has(k)){ seen.add(k); nq.push(t); }
    }
    q = nq; d++;
  }
  return Infinity;
}
// pegs at x = 60 / 150 / 240; peg heights follow capacity
function tolSVG(st, sel, cls){
  const X = [60, 150, 240], base = 172, R = 19, step = 40;
  let g = `<rect x="14" y="${base}" width="272" height="10" rx="5" fill="#CFCBC2"/>`;
  X.forEach((x,i) => {
    const h = TOL_CAP[i] * step + 8;
    g += `<rect x="${x-4}" y="${base-h}" width="8" height="${h}" rx="4" fill="#B9B4AA"/>`;
    st[i].forEach((c,j) => {
      const lifted = sel === i && j === st[i].length - 1;
      const y = lifted ? 22 : base - R - 2 - j * step;
      g += `<circle cx="${x}" cy="${y}" r="${R}" fill="${TOL_COL[c]}"${lifted ? ' class="lift"' : ''}/>`;
    });
    if (cls) g += `<rect data-peg="${i}" x="${x-45}" y="0" width="90" height="${base+10}" fill="transparent"/>`;
  });
  return `<svg class="${cls || 'tol-mini'}" viewBox="${cls ? '0 0 300 186' : '0 44 300 142'}" aria-hidden="true">${g}</svg>`;
}
function tolTap(){
  const s = session, board = rStim.querySelector('.tol-board');
  return guard(new Promise(res => {
    const h = e => { const t = e.target.closest('[data-peg]'); if (!t) return; e.preventDefault(); const tm = evtTime(e); cleanup(); res({peg:+t.dataset.peg, t:tm}); };
    function cleanup(){ board.removeEventListener('pointerdown', h); s.cleanups.delete(cleanup); }
    board.addEventListener('pointerdown', h); s.cleanups.add(cleanup);
  }));
}
async function tolProblem(goalStr, prac, idx, total){
  const goal = tolParse(goalStr), st = tolParse(TOL_START), min = tolMin(st, goal), limit = Math.max(8, min * 3);
  setProg(`${prac ? '練習' : ''}${idx}/${total}`);
  rStim.innerHTML = `<div class="tol">
    <div class="tol-goal"><span class="tol-lab">目標</span>${tolSVG(goal)}</div>
    <div class="tol-info"><span class="tol-mv">已移動0步</span></div>
    <div class="tol-wrap">${tolSVG(st, null, 'tol-board')}</div>
    <div class="tol-fb"></div></div>`;
  const draw = sel => { rStim.querySelector('.tol-wrap').innerHTML = tolSVG(st, sel, 'tol-board'); rStim.querySelector('.tol-mv').textContent = `已移動${moves}步`; };
  await frame();
  const t0 = performance.now();
  let moves = 0, sel = null, tFirst = null, solved = false;
  while (moves < limit){
    const {peg, t} = await tolTap();
    if (sel === null){
      if (!st[peg].length) continue;
      if (tFirst === null) tFirst = t;
      sel = peg; draw(sel);
    } else if (peg === sel){ sel = null; draw(sel); }
    else if (st[peg].length < TOL_CAP[peg]){
      st[peg].push(st[sel].pop()); sel = null; moves++; draw(sel);
      if (tolKey(st) === goalStr){ solved = true; break; }
    } else if (st[peg].length){ sel = peg; draw(sel); }
  }
  const tEnd = performance.now();
  const perfect = solved && moves === min;
  const fb = rStim.querySelector('.tol-fb');
  fb.innerHTML = !solved ? '<div class="fbk slow">已超過步數上限</div>'
    : prac ? (perfect ? '<div class="fbk ok">✓ 正確</div>' : '<div class="fbk err">完成了，但不是最少步數</div>')
    : '<div class="fbk ok">完成</div>';
  await sleep(prac ? 1400 : 900);
  rStim.innerHTML = '';
  return {block: prac ? 'practice' : 'test', trial:idx, cond:`min=${min}`, stim:goalStr, cresp:String(min), resp:String(moves),
    acc: perfect ? 1 : 0, rt: tFirst === null ? null : Math.round(tFirst - t0), solved, moves, min, plan: tFirst === null ? NaN : tFirst - t0, exec: tFirst === null ? NaN : tEnd - tFirst};
}
async function runTOL(){
  await screen(`<h2>倫敦塔測驗</h2><p class="ename">Tower of London</p>
    <p>移動下方的球，排成和上方「目標」一樣的樣子<br>先點一顆球把它拿起來，再點要放的柱子；每次只能移動最上面的一顆球，三根柱子由左到右最多能放3、2、1顆球<br>請想好再開始移動，用最少的步數完成</p>`, [{label:'開始練習', value:'go', cls:'go'}]);
  setResp('', 1);
  let gate;
  do {
    await getReady();
    const out = [];
    for (let i=0;i<TOL_SET.practice.length;i++) out.push(await tolProblem(TOL_SET.practice[i], true, i+1, TOL_SET.practice.length));
    gate = await practiceGate(out.filter(t => t.acc).length, out.length, false);
  } while (gate === 'again');
  setResp('', 1);
  await getReady();
  const trials = [];
  for (let i=0;i<TOL_SET.test.length;i++) trials.push(await tolProblem(TOL_SET.test[i], false, i+1, TOL_SET.test.length));
  const solvedMin = trials.filter(t => t.acc).length;
  const totalMoves = trials.reduce((a,t) => a + t.moves, 0), minSum = trials.reduce((a,t) => a + t.min, 0);
  const plan = mean(trials.map(t => t.plan).filter(x => !isNaN(x))), exec = mean(trials.map(t => t.exec).filter(x => !isNaN(x)));
  return {
    key:`最少步數完成${solvedMin}/${trials.length}`,
    metrics:{solvedMin, totalMoves, excess:totalMoves - minSum, plan, exec},
    summary:[
      ['最少步數完成題數（problems solved in the minimum number of moves）', `${solvedMin}/${trials.length}`, 1],
      ['總步數（total moves）', `${totalMoves}`],
      ['平均計畫時間（mean time to first move）', ms(plan)]],
    note:'',
    trials: trials.map(({solved, moves, min, plan, exec, ...t}) => t)
  };
}

  $('#cpSum').disabled = $('#clr').disabled = !n;
}
const rlabel = k => { const m = k.match(/^(.*?)（([A-Za-z0-9][A-Za-z0-9 \-′']*)）$/); return m ? `${m[1]}<span class="rle">${m[2].toLowerCase()}</span>` : k; };
function resultHTML(T, res, viewing){
  return `<h2>${T.zh}</h2><p class="ename">${T.en}</p>
    <div class="rgrid">${res.summary.map(([k,v,key]) => `<div class="rbox${key ? ' key' : ''}"${key ? ` style="--tint:${T.tint}"` : ''}><span class="rl">${rlabel(k)}</span><span class="rv">${v}</span></div>`).join('')}</div>`;
}

let busy = false;
async function launch(key){
  if (busy) return;
  if (!store.pid){
    const el = $('#sid'), err = $('#sidErr');
    err.hidden = false; el.setAttribute('aria-invalid', 'true');
    $('.idrow').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'});
    el.focus({preventScroll:true});
    return;
  }
  busy = true;
  const T = TASKS[key];
  let again = true;
  while (again){
    again = false;
    newSession(); openRunner(T.code);
    try {
      const res = await T.run();
      res.time = new Date().toISOString();
      store.results[key] = res; save(); renderHome(); queueResult(key, res);
      setProg(`結果${fmtTime(res.time)}`);
      const a = await screen(resultHTML(T, res), [{label:'再做一次', value:'again'}, {label:'回到列表', value:'home', cls:'go'}]);
      again = a === 'again';
    } catch(e){ if (e !== ABORT) console.error(e); }
    finally { abortSession(); closeRunner(); }
  }
  renderHome(); busy = false;
}

const sidEl = $('#sid');
sidEl.value = store.pid || '';
sidEl.addEventListener('input', () => { store.pid = sidEl.value.trim(); save(); if (store.pid){ $('#sidErr').hidden = true; sidEl.removeAttribute('aria-invalid'); } });
$('#groups').addEventListener('click', e => { const b = e.target.closest('[data-task]'); if (b) launch(b.dataset.task); });
async function viewResult(k){
  const T = TASKS[k], res = store.results[k];
  if (!T || !res || busy) return;
  busy = true; newSession(); openRunner(T.code); setProg(`結果${fmtTime(res.time)}`);
  try { await screen(resultHTML(T, res, true), [{label:'回到列表', value:'home', cls:'go'}]); }
  catch(e){ if (e !== ABORT) console.error(e); }
  finally { abortSession(); closeRunner(); busy = false; }
}
$('#sum').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) viewResult(b.dataset.view); });

function summaryText(){
  const lines = ['執行功能測驗組 結果', '暱稱：' + (store.pid || '（未填）')];
  for (const k of Object.keys(TASKS)){
    const r = store.results[k]; if (!r) continue;
    lines.push(`【${TASKS[k].zh}】` + r.summary.map(([a,b]) => `${a}：${b}`).join('｜'));
  }
  return lines.join('\n');
}
function csvText(){
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [['nickname','task','block','trial','condition','stimulus','correct_response','response','correct','rt_ms'].join(',')];
  for (const k of Object.keys(TASKS)){
    const r = store.results[k]; if (!r) continue;
    for (const t of r.trials) rows.push([store.pid, k, t.block, t.trial, t.cond, t.stim, t.cresp, t.resp, t.acc, t.rt].map(q).join(','));
  }
  return rows.join('\n');
}
function copyOut(text, label){
  const msg = $('#copyMsg'), box = $('#copyBox');
  const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); msg.hidden = false; msg.textContent = `無法自動複製，請長按下方文字全選後複製（${label}）`; };
  box.hidden = true;
  try {
    navigator.clipboard.writeText(text).then(() => { msg.hidden = false; msg.textContent = `已複製${label}，可以貼到表單或試算表`; }, fallback);
  } catch(e){ fallback(); }
}
$('#cpSum').addEventListener('click', () => copyOut(summaryText(), '結果摘要'));
$('#clr').addEventListener('click', () => { $('#clrConfirm').hidden = false; });
$('#clrNo').addEventListener('click', () => { $('#clrConfirm').hidden = true; });
$('#clrYes').addEventListener('click', () => { store.results = {}; save(); $('#clrConfirm').hidden = true; $('#copyMsg').hidden = true; $('#copyBox').hidden = true; renderHome(); });

renderHome();
/* ================= result upload (Google Apps Script backend, read by the leaderboard page) ================= */
const upOn = !!API_URL && typeof fetch === 'function';
const CID = (() => { let c = ''; try { c = localStorage.getItem('ef-cid') || ''; } catch(e){} if (!c){ c = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); try { localStorage.setItem('ef-cid', c); } catch(e){} } return c; })();
const loadQ = () => { try { return JSON.parse(localStorage.getItem('ef-outbox') || '[]'); } catch(e){ return []; } };
const saveQ = q => { try { localStorage.setItem('ef-outbox', JSON.stringify(q)); } catch(e){} };
let outbox = loadQ(), flushing = false;
function queueResult(key, res){
  if (!upOn || !res.metrics) return;
  outbox.push({nickname:store.pid, task:key, cid:CID, metrics:res.metrics, summary:res.summary.map(([a,b]) => `${a}：${b}`).join('｜'), time:res.time});
  saveQ(outbox); flushQ();
}
async function flushQ(){
  if (!upOn || flushing || !outbox.length) return;
  flushing = true;
  try {
    while (outbox.length){
      const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(outbox[0])});
      if (!r.ok) break;
      outbox.shift(); saveQ(outbox);
    }
  } catch(e){}
  flushing = false;
}
if (upOn){
  flushQ();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flushQ(); });
}
})();
</script>
</body>
</html>
